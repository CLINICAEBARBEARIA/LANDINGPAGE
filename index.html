<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo(a)! Vamos Conversar?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Profissional com Otimizações para Celular */
        :root {
            --background-color: #121212;
            --panel-color: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --bot-message-color: #2c2c2c;
            --user-message-color: #3700b3;
            --font-family: 'Inter', sans-serif;
        }
        * { box-sizing: border-box; }
        html, body {
            font-family: var(--font-family);
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 90vh; /* Limite na altura em desktop */
            background-color: var(--panel-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            opacity: 0;
            animation: fadeInBody 1s ease-in-out forwards;
        }
        @keyframes fadeInBody { to { opacity: 1; } }
        .image-panel { flex: 1; background-color: #000; }
        #question-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.5s ease-in-out;
        }
        .conversation-panel { flex: 1; display: flex; flex-direction: column; }
        .message-container { flex-grow: 1; padding: 30px; overflow-y: auto; }
        .message {
            padding: 15px 20px;
            border-radius: 20px;
            margin-bottom: 15px;
            max-width: 85%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInMessage 0.5s forwards;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .bot-message {
            background-color: var(--bot-message-color);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        .user-message {
            background-color: var(--user-message-color);
            color: white;
            align-self: flex-end;
            text-align: right;
            border-bottom-right-radius: 5px;
        }
        @keyframes fadeInMessage { to { opacity: 1; transform: translateY(0); } }
        .input-area { display: flex; padding: 20px; border-top: 1px solid #333; }
        #user-input {
            flex-grow: 1;
            background-color: #333;
            border: 1px solid #444;
            border-radius: 25px;
            padding: 15px 20px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        #user-input:focus { border-color: var(--primary-color); }
        #send-btn {
            background-color: var(--primary-color);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 2rem;
            margin-left: 15px;
            cursor: pointer;
            transition: background-color 0.3s;
            flex-shrink: 0;
        }
        #send-btn:hover { background-color: #a042f8; }

        /* --- OTIMIZAÇÕES PARA CELULAR --- */
        @media (max-width: 768px) {
            .chat-wrapper {
                flex-direction: column;
                height: 100%;
                width: 100%;
                border-radius: 0;
                max-height: none;
            }
            .image-panel {
                flex: 0.4; /* Altura menor para a imagem no celular */
                min-height: 200px; /* Altura mínima para não sumir */
            }
            .conversation-panel {
                flex: 0.6;
            }
            .message-container {
                padding: 15px;
            }
            .message {
                font-size: 0.95rem;
            }
            .input-area {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-wrapper">
        <div class="image-panel">
            <img id="question-image" src="COLOQUE_O_LINK_DA_SUA_IMAGEM_1_AQUI" alt="Imagem da pergunta">
        </div>
        <div class="conversation-panel">
            <div id="message-container" class="message-container"></div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Sua resposta...">
                <button id="send-btn">›</button>
            </div>
        </div>
    </div>

    <audio id="background-music" src="COLOQUE_O_LINK_DIRETO_DA_SUA_MUSICA_MP3_AQUI" loop></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // ======================= ÁREA DE CONFIGURAÇÃO =======================
            
            const webhookURL = 'COLOQUE_A_URL_DO_SEU_WEBHOOK_DO_N8N_AQUI';

            // 2. SUAS 10 PERGUNTAS E IMAGENS
            // Substitua as perguntas e os links das imagens abaixo.
            const questions = [
                { name: "nome",           question: "Oi, tudo bom? Se chegou até aqui, já tem nossa atenção. Primeiro de tudo, como se chama?", image: "gato.png" },
                { name: "email",          question: "Prazer, {nome}! Qual o seu melhor e-mail para contato?",                                     image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_2_AQUI" },
                { name: "nome_empresa",   question: "E qual é o nome da sua empresa ou projeto?",                                                 image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_3_AQUI" },
                { name: "principal_dor",  question: "O que mais te incomoda no seu negócio hoje? Qual é a sua principal 'dor'?",                 image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_4_AQUI" },
                { name: "objetivo_maior", question: "Se você pudesse resolver isso, qual o maior objetivo que alcançaria?",                       image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_5_AQUI" },
                { name: "ja_tentou",      question: "Você já tentou alguma outra solução para resolver esse problema?",                             image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_6_AQUI" },
                { name: "orcamento",      question: "Para um projeto que resolva isso de vez, qual a faixa de orçamento que você tem em mente?", image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_7_AQUI" },
                { name: "diferencial",    question: "O que você acredita que torna seu serviço/produto único no mercado?",                        image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_8_AQUI" },
                { name: "prazo",          question: "Em quanto tempo você gostaria de ver os primeiros resultados?",                               image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_9_AQUI" },
                { name: "finalizar",      question: "Excelente. Para finalizar, há algo mais que você gostaria de nos contar?",                   image: "COLOQUE_O_LINK_DA_SUA_IMAGEM_10_AQUI" }
            ];
            // ===================================================================

            // --- Lógica da Conversa (não precisa mexer aqui) ---
            const messageContainer = document.getElementById('message-container');
            const userInput = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const questionImage = document.getElementById('question-image');
            const backgroundMusic = document.getElementById('background-music');
            let currentQuestionIndex = 0;
            const userAnswers = {};
            let musicStarted = false;

            function addMessage(text, type) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${type}-message`;
                messageDiv.innerText = text;
                messageContainer.appendChild(messageDiv);
                messageContainer.scrollTop = messageContainer.scrollHeight;
            }

            function askQuestion() {
                if (currentQuestionIndex < questions.length) {
                    let questionText = questions[currentQuestionIndex].question;
                    if (questionText.includes('{nome}') && userAnswers.nome) {
                        questionText = questionText.replace('{nome}', userAnswers.nome.split(' ')[0]); // Pega só o primeiro nome
                    }
                    addMessage(questionText, 'bot');
                    questionImage.style.opacity = 0;
                    setTimeout(() => {
                        questionImage.src = questions[currentQuestionIndex].image;
                        questionImage.style.opacity = 1;
                    }, 500);
                    userInput.focus();
                } else {
                    finishConversation();
                }
            }

            function finishConversation() {
                // MENSAGEM FINAL ATUALIZADA
                const finalMessage = "Obrigado! Recebemos suas respostas. Vamos lhe retornar em até 1 dia útil. No momento, temos muitas pessoas para atender, mas já demos atenção à sua solicitação.";
                addMessage(finalMessage, 'bot');
                
                userInput.disabled = true;
                userInput.placeholder = "Conversa finalizada.";
                sendBtn.disabled = true;

                fetch(webhookURL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userAnswers),
                }).then(response => response.json()).then(data => console.log('Sucesso:', data)).catch((error) => console.error('Erro:', error));
            }

            function handleUserInput() {
                const answer = userInput.value.trim();
                if (answer === '') return;

                if (!musicStarted && backgroundMusic.src && !backgroundMusic.src.includes('COLOQUE_O_LINK')) {
                    backgroundMusic.volume = 0.2;
                    backgroundMusic.play().catch(e => console.log("Música bloqueada pelo navegador."));
                    musicStarted = true;
                }

                addMessage(answer, 'user');
                const questionName = questions[currentQuestionIndex].name;
                userAnswers[questionName] = answer;
                userInput.value = '';
                currentQuestionIndex++;
                setTimeout(askQuestion, 1000);
            }

            sendBtn.addEventListener('click', handleUserInput);
            userInput.addEventListener('keydown', (event) => {
                if (event.key === 'Enter') { handleUserInput(); }
            });

            setTimeout(askQuestion, 1000);
        });
    </script>
</body>
</html>
